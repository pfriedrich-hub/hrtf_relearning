[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hrtf_relearning"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "slab @ git+https://github.com/pfriedrich-hub/slab.git",
    "pybinsim @ git+https://github.com/pfriedrich-hub/pybinsim_tuil.git",
"h5py", "h5netcdf", "netCDF4", "metawear", "pyqt5", "pynput", "pyfar",
    "pycaw ; sys_platform == 'win32'"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hrtf_relearning*"]

[project.scripts]
hrtf = "hrtf_relearning.cli:main"


